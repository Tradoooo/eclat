name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: core C11 (tests + ASan/UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Dépôt requis (police licence + sources)
        run: |
          test -s LICENSE
          test -s README.md
          test -s CONTRACT.md
          test -n "$(find core -name '*.c' -o -name '*.h' | head -1)"
      - name: make core
        run: make core
      - name: make test
        run: make test
      - name: make test-san
        run: make test-san
      - name: Garde de taille
        run: make size-check

  python:
    name: jumeau Python + différentiel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: make core
        run: make core
      - name: python-tests
        run: make python-tests
      - name: différentiel C ↔ Python
        run: make differential

  spdx:
    name: garde SPDX
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: spdx-guard
        run: make spdx

  fuzz:
    name: fuzz du parseur de politique (ASan/UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: make fuzz
        run: make fuzz FUZZ_ITERATIONS=3000

  mutants:
    name: mutants du cœur C (taux de détection 100 %)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: make mutants
        run: make mutants

  # Intégration WAMR sur Linux : aucun SDP requis. Télécharge WAMR (épinglé WAMR-2.4.5) et
  # wasi-sdk (empreinte sha256 vérifiée), compile les 3 modules de démonstration en .wasm,
  # construit le chargeur et rejoue ECL-04/05/06/07.
  wasm:
    name: runtime WAMR + modules .wasm (ECL-04/05/06/07)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: dépendances (WAMR épinglé + wasi-sdk vérifié)
        run: tools/fetch-deps.sh
      - name: modules .wasm + chargeur
        run: make core wasm runtime
      - name: intégration
        run: make test-wasm